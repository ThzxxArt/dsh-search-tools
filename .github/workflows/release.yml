name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm release
      - name: Publish to npm
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version is already published; skipping npm publish."
            exit 0
          fi
          if npm publish --provenance --access public; then
            exit 0
          fi
          # A fresh version can be accepted before the registry read model sees it.
          for attempt in 1 2 3 4 5 6; do
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "$package@$version is now visible; treating the publish attempt as successful."
              exit 0
            fi
            echo "Waiting for $package@$version to become visible (attempt $attempt/6)..."
            sleep 10
          done
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Download the published npm tarball
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          mkdir -p dist
          for attempt in 1 2 3 4 5 6; do
            url=$(npm view "$package@$version" dist.tarball --registry=https://registry.npmjs.org)
            if [ -n "$url" ] && curl --fail --silent --show-error --location "$url" --output "dist/$package-$version.tgz"; then
              echo "Downloaded the registry tarball: $url"
              exit 0
            fi
            echo "Waiting for the npm tarball (attempt $attempt/6)..."
            sleep 10
          done
          exit 1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
